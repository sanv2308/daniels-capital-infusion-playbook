var state = { view:"home", industryId:null, openCats:{}, query:"" };

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function industriesByCat(catId) {
  var out = [];
  for (var k in INDUSTRIES) { if (INDUSTRIES[k].category === catId) out.push({key:k, ind:INDUSTRIES[k]}); }
  return out;
}

function searchMatches(q) {
  var lower = q.toLowerCase();
  var out = [];
  for (var k in INDUSTRIES) {
    var v = INDUSTRIES[k];
    var hit = false;
    if (v.name.toLowerCase().indexOf(lower) >= 0) hit = true;
    if (!hit && v.hero.toLowerCase().indexOf(lower) >= 0) hit = true;
    if (!hit && v.pains.some(function(p){ return p[0].toLowerCase().indexOf(lower) >= 0; })) hit = true;
    if (!hit && v.uses.some(function(u){ return u.toLowerCase().indexOf(lower) >= 0; })) hit = true;
    if (hit) out.push({key:k, ind:v});
  }
  return out;
}

function renderHome() {
  var html = "";
  if (state.query) {
    var matches = searchMatches(state.query);
    html += '<div class="ci-sub">search · "' + escapeHtml(state.query) + '" · ' + matches.length + ' match' + (matches.length===1?'':'es') + '</div>';
    if (matches.length === 0) { html += '<div class="ci-empty">No matches.</div>'; return html; }
    matches.forEach(function(m){
      html += '<div class="ci-ind-row" data-action="industry" data-id="' + m.key + '" style="padding-left:14px;">';
      html += '<span class="ci-ind-name">' + escapeHtml(m.ind.name) + '</span>';
      if (m.ind.validated) html += '<span class="ci-ind-tag">researched</span>';
      html += '<i class="ti ti-chevron-right" style="color:var(--color-text-tertiary);font-size:14px;"></i>';
      html += '</div>';
    });
    return html;
  }
  CATEGORIES.forEach(function(c){
    var inds = industriesByCat(c.id);
    var isOpen = !!state.openCats[c.id];
    html += '<div class="ci-cat' + (isOpen ? ' open' : '') + '">';
    html += '<div class="ci-cat-head" data-action="toggle" data-id="' + c.id + '">';
    html += '<i class="ci-cat-icon ti ' + c.icon + '" aria-hidden="true"></i>';
    html += '<span class="ci-cat-name">' + escapeHtml(c.name) + '</span>';
    html += '<span class="ci-cat-count">' + inds.length + '</span>';
    html += '<i class="ci-cat-chev ti ti-chevron-right" aria-hidden="true"></i>';
    html += '</div>';
    if (isOpen) {
      html += '<div class="ci-cat-body">';
      inds.forEach(function(item){
        html += '<div class="ci-ind-row" data-action="industry" data-id="' + item.key + '">';
        html += '<span class="ci-ind-name">' + escapeHtml(item.ind.name) + '</span>';
        if (item.ind.validated) html += '<span class="ci-ind-tag">researched</span>';
        html += '<i class="ti ti-chevron-right" style="color:var(--color-text-tertiary);font-size:14px;"></i>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  return html;
}

function renderIndustry() {
  var v = INDUSTRIES[state.industryId];
  if (!v) return '<div class="ci-empty">Industry not found.</div>';
  var cat = null;
  CATEGORIES.forEach(function(c){ if (c.id === v.category) cat = c; });
  var html = '';
  html += '<div class="ci-back" data-action="back"><i class="ti ti-arrow-left" aria-hidden="true"></i> back to ' + escapeHtml(cat ? cat.name.toLowerCase() : 'all') + '</div>';
  html += '<h1 class="ci-h1">' + escapeHtml(v.name) + '</h1>';
  html += '<p class="ci-sub">' + escapeHtml(cat ? cat.name.toLowerCase() : '') + (v.validated ? ' · checked' : ' · draft') + '</p>';
  html += '<div class="ci-hero"><p class="ci-hero-label">quick read</p><p class="ci-hero-text">' + escapeHtml(v.hero) + '</p></div>';
  html += '<p class="ci-rapport">"' + escapeHtml(v.rapport) + '"</p>';
  html += '<div class="ci-section"><h2 class="ci-h2">what might be hurting → ask this</h2>';
  v.pains.forEach(function(p){
    html += '<div class="ci-pain-item"><p class="ci-pain-label">' + escapeHtml(p[0]) + '</p><p class="ci-pain-ask">ask: ' + escapeHtml(p[1]) + '</p></div>';
  });
  html += '</div>';
  html += '<div class="ci-section"><h2 class="ci-h2">quick qualify</h2><ol class="ci-list">';
  v.quals.forEach(function(q,i){ html += '<li><span class="num">' + (i+1) + '</span><span>' + escapeHtml(q) + '</span></li>'; });
  html += '</ol></div>';
  html += '<div class="ci-section"><h2 class="ci-h2">money could help with</h2>';
  v.uses.forEach(function(u){ html += '<div class="ci-use">' + escapeHtml(u) + '</div>'; });
  html += '</div>';
  if (v.validated) {
    html += '<div class="ci-note"><i class="ti ti-check" style="color:var(--color-text-success);font-size:13px;" aria-hidden="true"></i><span>Checked against industry sources in May 2026.</span></div>';
  } else {
    html += '<div class="ci-note"><i class="ti ti-info-circle" style="font-size:13px;" aria-hidden="true"></i><span>Draft card. Use it as a guide, not a script.</span></div>';
  }
  return html;
}

function render() {
  var main = document.getElementById("ciMain");
  if (state.view === "industry") main.innerHTML = renderIndustry();
  else main.innerHTML = renderHome();
}

function scrollToPlaybook() {
  try {
    var hostDoc = (window.parent && window.parent !== window) ? window.parent.document : document;
    var target = hostDoc.getElementById("playbookMount") || hostDoc.querySelector(".ci-bar") || document.querySelector(".ci-bar");
    if (target && target.scrollIntoView) {
      target.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  } catch (e) {
    var fallback = document.querySelector(".ci-bar");
    if (fallback && fallback.scrollIntoView) fallback.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

document.getElementById("ciApp").addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if (!t) return;
  var action = t.dataset.action;
  if (action === "toggle") { state.openCats[t.dataset.id] = !state.openCats[t.dataset.id]; render(); }
  else if (action === "industry") { state.view = "industry"; state.industryId = t.dataset.id; render(); scrollToPlaybook(); }
  else if (action === "back") { state.view = "home"; state.industryId = null; render(); scrollToPlaybook(); }
});

document.getElementById("ciSearch").addEventListener("input", function(e){
  state.query = e.target.value.trim();
  if (state.view === "industry") { state.view = "home"; state.industryId = null; }
  render();
});

render();

} catch (err) {
  var ce = document.getElementById("ciErr");
  if (ce) { ce.style.display = "block"; ce.textContent = "Render error: " + (err && err.message ? err.message : String(err)); }
}
})();
</script>
